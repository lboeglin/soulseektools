name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Every test binary links the whole dependency tree, and with debug info the
# suite's build is 15 GB against 1.3 GB without -- more than an Ubuntu runner
# has free. A failure here is read from the assertion, not a debugger.
env:
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Nothing is installed here: `stk` carries its own decoder, and the audio
      # fixtures are either generated in Rust or committed. The oracle tests
      # that need the library oracle/ was captured from skip; the name-form
      # ones run from the capture alone.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
