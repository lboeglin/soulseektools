name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Debug info makes the test build 15 GB, more than a runner has free.
# IPADIC is cached so the build doesn't depend on lindera.dev being up.
env:
  CARGO_PROFILE_DEV_DEBUG: 0
  LINDERA_BUILD_DICTIONARY_CACHE_DIR: ${{ github.workspace }}/.lindera-cache

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: .lindera-cache
          key: lindera-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: lindera-${{ runner.os }}-

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
