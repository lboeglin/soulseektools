[package]
name = "stk"
description = "Keep a music library clean: transcodes, duplicates, covers, genres and tags, and fill its gaps through Soulseek."
version = "1.1.1"
edition = "2021"
rust-version = "1.89"
license = "MIT"
authors = ["Lohan Boeglin"]
repository = "https://github.com/lboeglin/soulseektools"

[lib]
name = "stk"
path = "src/lib.rs"

[[bin]]
name = "stk"
path = "src/bin/stk.rs"

[dependencies]
axoupdater = { version = "0.10.3", default-features = false, features = ["github_releases", "blocking"] }
base64 = "0.22.1"
clap = { version = "4.5.61", features = ["derive", "env"] }
clap_complete = "4.6.11"
csv = "1.4.0"
ebur128 = "0.1.10"
fancy-regex = "0.19.0"
globset = "0.4.16"
# PNG for the spectrogram this crate writes; JPEG and PNG for a cover `art set` checks.
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png"] }
lindera = { version = "6.1.0", default-features = false, features = ["embed-ipadic"] }
lofty = "0.22.2"
# The raw Ogg comment packet, which lofty only hands back reinterpreted.
ogg_pager = "0.7.2"
# Only `plist::Value`, for an Apple Music `Library.xml`; no serde mapping.
plist = { version = "1.10.1", default-features = false }
rapidfuzz = "0.5.0"
rayon = "1.12.0"
realfft = "3.5.0"
regex = "1.13.1"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "form", "json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusty-chromaprint = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.10.9"
# Only the formats the extension lists declare; `all` would pull in decoders for
# containers `library/scan.rs` does not recognise.
symphonia = { version = "0.6.1", default-features = false, features = [
    "opt-simd",
    "all-meta",
    "aac",
    "aiff",
    "alac",
    "flac",
    "isomp4",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
# The ALAC magic cookie, which symphonia's decoder reads and does not hand back.
symphonia-common = "0.6.1"
thiserror = "2.0.20"
toml = "1.0.7"
trash = "5.2.9"
unicode-normalization = "0.1.25"
unicode-width = "0.2.2"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# The library is internal to the binary, not a published API.
missing_errors_doc = "allow"
# Fires on product names like AcoustID and DECO_27.
doc_markdown = "allow"

# Decoding, FFTs and loudness are all in dependencies; unoptimised, they make
# the test suite several times slower.
[profile.dev.package."*"]
opt-level = 2

[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
# Writing the audio fixtures this crate has no reason to encode itself.
flacenc = { version = "0.5.1", default-features = false }
hound = "3.5.1"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png"] }
# Reading raw tag items in tests.
lofty = "0.22.2"
proptest = "1.11.0"
rand = "0.9.5"
rand_distr = "0.5.1"
realfft = "3.5.0"
rusqlite = "0.40.2"
toml = "1.0.7"
which = "8.0.6"

