[project]
name = "soulseektools"
version = "0.1.0"
description = "Build a music library from a streaming export via Soulseek, and keep it clean afterwards."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "lohan" }]
keywords = ["soulseek", "slskd", "music", "library", "flac", "tagging"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "httpx>=0.27",
    "mutagen>=1.47",
    "numpy>=1.26",
    "platformdirs>=4.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pykakasi>=2.2",
    "rapidfuzz>=3.9",
    "rich>=13.7",
    "textual>=0.60",
    "tomli-w>=1.0",
    "typer>=0.12",
]

[project.scripts]
stk = "soulseektools.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soulseektools"]

[tool.uv]
link-mode = "copy"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "C4",          # comprehensions
    "SIM",         # simplify
    "PTH",         # prefer pathlib
    "RET",         # return consistency
    "ARG",         # unused arguments
    "TID",         # tidy imports
    "RUF",
]
ignore = [
    "E501",        # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.ruff.lint.isort]
known-first-party = ["soulseektools"]

[tool.mypy]
# Left to the running interpreter: the numpy stubs use 3.12+ syntax, and ruff's
# target-version already guards against language features newer than 3.11.
files = ["src"]
exclude = ["legacy"]
strict = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]

[[tool.mypy.overrides]]
module = ["pykakasi.*", "mutagen.*"]
ignore_missing_imports = true

# These modules exist solely to adapt third-party libraries that ship no
# annotations for the entry points used here.
[[tool.mypy.overrides]]
module = ["soulseektools.text.romaji", "soulseektools.library.tags"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "requires_ffmpeg: needs ffmpeg and ffprobe on PATH",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/soulseektools"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
