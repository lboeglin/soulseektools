[workspace]
members = ["crates/stk"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["lohan"]
repository = "https://github.com/lboeglin/soulseektools"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# The library is internal to the `stk-rs` binary, not a published API, so the
# `# Errors` boilerplate documents nothing a caller cannot see.
missing_errors_doc = "allow"
# Fires on every product name in the prose these modules are deliberately full
# of -- AcoustID, MusicBrainz, DECO_27 -- none of which is code.
doc_markdown = "allow"

# The audio work is all in dependencies now -- decoding, the transforms behind
# the fingerprint and the loudness meter -- and an unoptimised build of them
# makes the suite several times slower without making any of this crate's own
# code easier to step through.
[profile.dev.package."*"]
opt-level = 2
