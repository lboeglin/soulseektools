[package]
name = "stk"
description = "Build a music library from a streaming export via Soulseek, and keep it clean afterwards."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "stk"
path = "src/lib.rs"

[[bin]]
name = "stk"
path = "src/bin/stk.rs"

[dependencies]
clap = { version = "4.5.61", features = ["derive", "env"] }
csv = "1.4.0"
fancy-regex = "0.19.0"
globset = "0.4.16"
kakasi = "0.1.0"
lofty = "0.22.2"
rapidfuzz = "0.5.0"
rayon = "1.12.0"
realfft = "3.5.0"
regex = "1.13.1"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.10.9"
thiserror = "2.0.20"
toml = "1.0.7"
unicode-normalization = "0.1.25"
which = "8.0.6"

[lints]
workspace = true

[dev-dependencies]
rand = "0.9.5"
rand_distr = "0.5.1"
realfft = "3.5.0"
rusqlite = "0.40.2"
toml = "1.0.7"
