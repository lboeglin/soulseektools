# Per-album and per-track overrides, for an artist whose files are not all one
# genre. Both are keyed by artist first, then by album title or track title, and
# both match on the normalised name exactly as the artist keys above do.
#
# Nested tables rather than an "Artist/Album" key, because an artist name may
# itself contain a slash and a combined key could not say which one separated.
#
# [albums.Shihori]
# "Prismatic" = "J-Pop"
#
# [tracks.Shihori]
# "Sakura Sunrise" = "Anime"
