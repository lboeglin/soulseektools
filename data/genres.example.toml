# Artist-to-genre map for `stk genre apply`.
#
# This is per-library data: it describes one person's artist roster and is not
# meant to be reused as-is. Copy it to the path named by `genres.map_path` in
# your config and edit it for your own library.
#
# Artists are matched on their normalised name, so "DECO*27" here also covers a
# "DECO_27" folder on disk. A value may be one genre or a list of them.
#
# An artist who crosses genres can be pinned down further with the [albums] and
# [tracks] sections at the bottom of this file. The most specific entry wins:
# track, then album, then artist.

