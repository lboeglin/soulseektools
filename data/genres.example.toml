# Artist-to-genre map for `stk genre apply`. Copy it to the path in
# `genres.map_path` and list your own artists.
#
# Names match on their normalised form, so "DECO*27" also covers a "DECO_27"
# folder. A value is one genre or a list. The most specific entry wins:
# track, then album, then artist.

[artists]
"DECO*27" = "Vocaloid"
ZUN = "Touhou"
"Dave Rodgers" = "Eurobeat"
"COOL&CREATE" = ["Touhou", "Electronic"]
"上海アリス幻樂団" = "Touhou"

[albums."Dave Rodgers"]
"Super Eurobeat Presents Initial D" = "Anime"

[tracks.ZUN]
"Bad Apple!!" = "Anime"
